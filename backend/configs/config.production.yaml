# =============================================================================
# Staff Display Platform — production configuration
# Selected automatically when APP_ENV=production (or via CONFIG_PATH).
# Strict validation applies: see internal/config/validate.go
# =============================================================================

app:
  name: staffdisplay
  timezone: Asia/Bangkok
  shutdown_grace: 15s

server:
  # Behind nginx: bind to loopback only.
  host: 127.0.0.1
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  # TLS is terminated by nginx by default (see deploy/nginx.conf).
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

logging:
  development: false
  level: info
  encoding: json

database:
  host: 127.0.0.1
  port: 5432
  user: staffdisplay
  name: staffdisplay
  sslmode: require
  timezone: Asia/Bangkok
  max_open_connections: 25
  max_idle_connections: 5
  connection_max_lifetime: 30m

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h

cors:
  # Single domain + path architecture: exactly one origin (BLUEPRINT §32).
  allowed_origins:
    - https://display.example.com
