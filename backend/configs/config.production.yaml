# =============================================================================
# Staff Display Platform — production profile (APP_ENV=production)
# =============================================================================
# Selected automatically when APP_ENV=production (or through CONFIG_PATH).
# Strict validation applies: see internal/config/validate.go + validate_tiers.go
# and the matrix in docs/DEPLOYMENT.md §1.
#
# Secrets come from the environment or from a *_FILE secret file — never from a
# YAML file (startup rejects them).
# =============================================================================

server:
  # Behind nginx: bind to loopback only.
  host: 127.0.0.1

logging:
  # Structured logs for journald/vector collection.
  development: false
  encoding: json

database:
  user: staffdisplay
  # The production database requires TLS with a verified peer.
  sslmode: require

cors:
  # Single domain + path architecture: exactly one origin (BLUEPRINT §32).
  allowed_origins:
    - https://display.example.com

store:
  slug:
    # A public store URL is a brand asset: at least three characters, and the
    # operator-only paths are reserved on top of the platform paths.
    min_length: 3
    extra_reserved_slugs:
      - admin
      - portal
