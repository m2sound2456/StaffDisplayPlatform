# =============================================================================
# Staff Display Platform — shared configuration base (FG3)
# =============================================================================
# Merged for every APP_ENV, before the environment profile
# (configs/config.<APP_ENV>.yaml) and before the environment variables:
#
#   built-in defaults < config.yaml < config.<env>.yaml < environment < *_FILE
#
# Only environment neutral values belong here. Secrets (AUTH_JWT_SECRET,
# DATABASE_PASSWORD) are NEVER stored in a YAML file — startup rejects them —
# see docs/DEPLOYMENT.md §2.
# =============================================================================

app:
  name: staffdisplay
  timezone: Asia/Bangkok
  shutdown_grace: 15s

server:
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  # TLS is terminated by nginx by default (see deploy/nginx.conf).
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

logging:
  level: info

database:
  host: 127.0.0.1
  port: 5432
  name: staffdisplay
  timezone: Asia/Bangkok
  max_open_connections: 25
  max_idle_connections: 5
  connection_max_lifetime: 30m

# Token TTLs are used from FG4 onwards.
auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h

# Deployment policy for new stores (consumed by the store service from FG5).
# Everything here may only tighten the database rules of docs/DATABASE.md §2:
# the slug pattern, its 63 character ceiling and the reserved platform paths are
# fixed by the migration set.
store:
  default_timezone: Asia/Bangkok
  default_status: active
  slug:
    min_length: 1
    max_length: 63
    auto_generate: true
    extra_reserved_slugs: []
