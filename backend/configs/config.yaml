# =============================================================================
# Staff Display Platform — development configuration
# =============================================================================
# Secrets (database password, JWT secret) are NEVER stored here: they come from
# backend/.env (see .env.example) or the process environment.
# =============================================================================

app:
  name: staffdisplay
  timezone: Asia/Bangkok
  shutdown_grace: 15s

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

logging:
  development: true
  level: info
  encoding: console

database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  name: staffdisplay
  sslmode: disable
  timezone: Asia/Bangkok
  max_open_connections: 25
  max_idle_connections: 5
  connection_max_lifetime: 30m

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 720h

cors:
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
