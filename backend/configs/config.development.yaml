# =============================================================================
# Staff Display Platform — development profile (APP_ENV=development)
# =============================================================================
# Local machine only: Vite dev server, console logs, the local PostgreSQL
# instance and the development signing key. Validation is relaxed here; every
# rule that protects a live tenant applies to staging/production instead.
#
# Secrets still come from backend/.env (git-ignored) or the environment.
# =============================================================================

server:
  # Reachable from the LAN so a tablet can be pointed at the dev machine.
  host: 0.0.0.0

logging:
  development: true
  encoding: console
  # level: debug

database:
  user: postgres
  # The local PostgreSQL has no TLS configured.
  sslmode: disable

cors:
  # The Vite dev server origin(s). Same origin in production.
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

store:
  slug:
    # Short slugs are convenient while testing by hand.
    min_length: 1
