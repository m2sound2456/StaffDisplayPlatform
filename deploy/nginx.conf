# =============================================================================
# Staff Display Platform — nginx reverse proxy (FG1 skeleton, completed in FG31)
# =============================================================================
# Single domain + path-based tenants (BLUEPRINT §32):
#   /                 SPA landing
#   /app              Admin application
#   /s/{store-slug}   Store display  (created by a database row, never a vhost!)
#   /setup            Device setup + QR pairing
#   /api/v1/...       Go REST API
#   /ws               Realtime WebSocket
#   /healthz /readyz  probes
# =============================================================================

# Rate-limit zones (used from FG37 onwards; harmless until referenced)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pair_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=600r/m;

# WebSocket upgrade support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream staffdisplay_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name display.example.com;      # replace with the platform domain

    # certbot (FG32) will add the TLS server block + redirect automatically.
    # Until then keep HTTP for local/staging verification.

    root /opt/staffdisplay/web;
    index index.html;

    client_max_body_size 12m;             # employee images / promotion media (FG7)
    server_tokens off;

    # --- security headers (API sends its own as defence in depth) -----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- compression --------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=120 nodelay;

        proxy_pass http://staffdisplay_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Realtime (FG22) ---------------------------------------------------
    location /ws {
        proxy_pass http://staffdisplay_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- probes ------------------------------------------------------------
    location = /healthz { proxy_pass http://staffdisplay_api; access_log off; }
    location = /readyz  { proxy_pass http://staffdisplay_api; access_log off; }

    # --- hashed build assets: immutable ------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- PWA service worker / manifest: never cache aggressively -----------
    location = /sw.js          { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # --- SPA shell for every path route (incl. /s/{slug}, /setup, /app) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
